services:
  mcp-server:
    build:
      context: ../packages/mcp-server
      dockerfile: ../deploy-prod/mcp-server.Dockerfile
    expose:
      - "8020"
    env_file:
      - .env.production
    volumes:
      - mcp-data:/app/data
      - ./credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mcp-data:
  caddy-data:
  caddy-config:
